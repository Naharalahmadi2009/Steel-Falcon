<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steel Falcon</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080d12;color:#eaf2f5;font:14px Arial;overflow:hidden}canvas{display:block;margin:auto;max-width:100vw;max-height:100vh;background:#1b2b25}#help{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#071018dd;border:1px solid #ffffff22;padding:9px 14px;border-radius:20px;color:#b9c8ce;white-space:nowrap}</style></head><body><canvas id="game" width="960" height="540"></canvas><div id="help">WASD move · SHIFT sprint · C crouch · E rescue · Mouse aim/shoot · R reload</div><script>
const c=document.getElementById('game'),g=c.getContext('2d'),W=960,H=540;let keys={},mouse={x:480,y:270,down:0},mode='menu',last=0,shake=0,flash=0,particles=[];let p,ally,enemies,guns,bullets,walls;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(mode==='menu'&&(e.key==='Enter'||e.key===' '))start();if(e.key.toLowerCase()==='e')rescue();if(e.key.toLowerCase()==='r')reload()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);c.onmousemove=e=>{let r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height};c.onmousedown=()=>mouse.down=1;c.onmouseup=()=>mouse.down=0;
function start(){mode='play';p={x:80,y:460,hp:100,st:100,ammo:18,max:18,weapon:'PISTOL',cool:0,reload:0,crouch:false,kills:0};ally={x:190,y:460,hp:100,rescued:false};enemies=[{x:470,y:120,hp:4,alert:0},{x:650,y:180,hp:4,alert:0},{x:780,y:390,hp:4,alert:0},{x:430,y:370,hp:4,alert:0},{x:720,y:80,hp:4,alert:0}];guns=[{x:300,y:420,n:'RIFLE',a:30},{x:550,y:450,n:'SHOTGUN',a:8},{x:810,y:130,n:'SNIPER',a:5}];bullets=[];particles=[];walls=[{x:250,y:100,w:150,h:24},{x:380,y:230,w:24,h:150},{x:560,y:90,w:160,h:24},{x:610,y:300,w:180,h:24},{x:150,y:260,w:130,h:24}];}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function reload(){if(mode==='play'&&p.reload<=0&&p.ammo<p.max)p.reload=1.1}function rescue(){if(mode==='play'&&!ally.rescued&&dist(p,ally)<58){ally.rescued=true;burst(ally.x,ally.y,'#62e6a1',18)}}
function burst(x,y,col,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,t:.5,col})}function blocked(x,y){return walls.some(w=>x>w.x-14&&x<w.x+w.w+14&&y>w.y-14&&y<w.y+w.h+14)}function shoot(){if(p.cool>0||p.reload>0||p.ammo<=0)return;p.cool=p.weapon==='SHOTGUN'?.5:p.weapon==='SNIPER'?.9:.16;p.ammo--;let a=Math.atan2(mouse.y-p.y,mouse.x-p.x),spread=p.weapon==='SHOTGUN'?.22:.025,n=p.weapon==='SHOTGUN'?5:1;for(let i=0;i<n;i++){let q=a+(Math.random()-.5)*spread;bullets.push({x:p.x,y:p.y,vx:Math.cos(q)*700,vy:Math.sin(q)*700,t:1,hit:false})}burst(p.x+Math.cos(a)*25,p.y+Math.sin(a)*25,'#ffd36a',4);shake=3}
function update(dt){if(mode!=='play')return;p.cool-=dt;p.reload-=dt;if(p.reload<=0&&p.reload+dt>0)p.ammo=p.max;p.crouch=!!keys.c;let sprint=keys.shift&&!p.crouch&&p.st>0,sp=p.crouch?85:sprint?285:175;if(sprint)p.st-=38*dt;else p.st=Math.min(100,p.st+25*dt);let dx=(keys.d||keys.arrowright)-(keys.a||keys.arrowleft),dy=(keys.s||keys.arrowdown)-(keys.w||keys.arrowup),l=Math.hypot(dx,dy)||1,nx=p.x+dx/l*sp*dt,ny=p.y+dy/l*sp*dt;if(!blocked(nx,p.y))p.x=nx;if(!blocked(p.x,ny))p.y=ny;p.x=Math.max(22,Math.min(938,p.x));p.y=Math.max(45,Math.min(515,p.y));if(mouse.down)shoot();for(let gun of guns)if(gun.x>0&&dist(p,gun)<30){p.weapon=gun.n;p.max=gun.a;p.ammo=gun.a;gun.x=-1;burst(p.x,p.y,'#ffe27a',12)}for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;if(b.x<0||b.x>W||b.y<0||b.y>H||blocked(b.x,b.y))b.t=0;for(let e of enemies)if(b.t>0&&dist(b,e)<18){e.hp--;b.t=0;burst(e.x,e.y,'#ff8b6b',7);if(e.hp<=0){p.kills++;burst(e.x,e.y,'#e85b5b',16)}}}bullets=bullets.filter(b=>b.t>0);enemies=enemies.filter(e=>e.hp>0);for(let e of enemies){let d=dist(p,e),visible=d<300&&!p.crouch;e.alert=Math.max(0,e.alert-dt);if(visible)e.alert=2;if(e.alert>0){let a=Math.atan2(p.y-e.y,p.x-e.x);let nx=e.x+Math.cos(a)*42*dt,ny=e.y+Math.sin(a)*42*dt;if(!blocked(nx,e.y))e.x=nx;if(!blocked(e.x,ny))e.y=ny;if(d<42){p.hp-=22*dt;flash=.08}}}if(ally.rescued){ally.x+=(p.x-ally.x)*Math.min(1,dt*4);ally.y+=(p.y-ally.y)*Math.min(1,dt*4)}if(p.hp<=0)mode='dead';if(ally.rescued&&p.x>875)mode='win';for(let z of particles){z.x+=z.vx*dt;z.y+=z.vy*dt;z.vx*=.96;z.vy*=.96;z.t-=dt}particles=particles.filter(z=>z.t>0);shake=Math.max(0,shake-dt*12);flash=Math.max(0,flash-dt)}
function bar(x,y,w,v,max,label){g.fillStyle='#071018';g.fillRect(x,y,w,8);g.fillStyle=label==='HP'?'#e86b63':'#5dd6a0';g.fillRect(x,y,w*Math.max(0,v)/max,8);g.fillStyle='#dce7eb';g.fillText(label,x,y-4)}function draw(){g.clearRect(0,0,W,H);if(mode==='menu'){g.fillStyle='#0c171d';g.fillRect(0,0,W,H);g.fillStyle='#62e6a1';g.font='bold 64px Arial';g.textAlign='center';g.fillText('STEEL FALCON',W/2,190);g.font='20px Arial';g.fillStyle='#c8d7dc';g.fillText('A 2D tactical extraction mission',W/2,230);g.fillText('Rescue your teammate. Survive. Reach extraction.',W/2,265);g.fillStyle='#ffd36a';g.fillText('PRESS ENTER TO DEPLOY',W/2,350);g.textAlign='left';return}g.save();g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);g.fillStyle='#20352b';g.fillRect(0,0,W,H);g.strokeStyle='#2e4b3c';for(let i=0;i<W;i+=40){g.beginPath();g.moveTo(i,0);g.lineTo(i,H);g.stroke()}for(let i=0;i<H;i+=40){g.beginPath();g.moveTo(0,i);g.lineTo(W,i);g.stroke()}g.fillStyle='#d8bd63';g.fillRect(875,0,65,H);g.fillStyle='#182018';g.font='bold 13px Arial';g.fillText('EXTRACTION',880,270);for(let w of walls){g.fillStyle='#4a5a58';g.fillRect(w.x,w.y,w.w,w.h);g.strokeStyle='#81908b';g.strokeRect(w.x,w.y,w.w,w.h)}for(let gun of guns)if(gun.x>0){g.fillStyle='#ffd36a';g.fillRect(gun.x-11,gun.y-4,22,8);g.fillStyle='#fff';g.fillText(gun.n,gun.x-25,gun.y-13)}if(!ally.rescued){g.fillStyle='#62e6a1';g.beginPath();g.arc(ally.x,ally.y,15,0,7);g.fill();g.fillStyle='#fff';g.fillText('RESCUE [E]',ally.x-35,ally.y-24)}else{g.fillStyle='#62e6a1';g.beginPath();g.arc(ally.x,ally.y,11,0,7);g.fill()}for(let e of enemies){g.fillStyle='#d95757';g.beginPath();g.arc(e.x,e.y,15,0,7);g.fill();g.fillStyle='#111';g.fillRect(e.x-16,e.y-24,32,5);g.fillStyle='#f06d62';g.fillRect(e.x-16,e.y-24,32*e.hp/4,5);if(e.alert>0){g.fillStyle='#ffd36a';g.fillText('!',e.x-3,e.y-29)}}for(let b of bullets){g.fillStyle='#fff0a0';g.beginPath();g.arc(b.x,b.y,3,0,7);g.fill()}g.save();g.translate(p.x,p.y);g.rotate(Math.atan2(mouse.y-p.y,mouse.x-p.x));g.fillStyle=p.crouch?'#5487b5':'#4e9fe7';g.fillRect(-14,-14,28,28);g.fillStyle='#b9c5ca';g.fillRect(8,-4,25,8);g.restore();for(let z of particles){g.globalAlpha=Math.max(0,z.t*2);g.fillStyle=z.col;g.fillRect(z.x,z.y,4,4);g.globalAlpha=1}g.fillStyle='#dce7eb';g.font='14px Arial';g.fillText('STEEL FALCON',18,25);bar(18,50,125,p.hp,100,'HP');bar(165,50,125,p.st,100,'STAMINA');g.fillText(p.reload>0?'RELOADING...':p.weapon+'  '+p.ammo+'/'+p.max,320,54);g.fillText('KILLS '+p.kills,520,54);g.fillText('TEAM '+(ally.rescued?'RESCUED':'MISSING'),650,54);g.fillStyle='#071018cc';g.fillRect(820,20,120,110);g.fillStyle='#fff';g.fillText('MINIMAP',842,38);g.fillStyle='#31483b';g.fillRect(830,48,100,72);g.fillStyle='#4e9fe7';g.fillRect(830+p.x/W*100-3,48+p.y/H*72-3,6,6);g.fillStyle='#d95757';for(let e of enemies)g.fillRect(830+e.x/W*100-2,48+e.y/H*72-2,4,4);g.restore();if(flash>0){g.fillStyle='rgba(255,50,50,.22)';g.fillRect(0,0,W,H)}if(mode==='win'||mode==='dead'){g.fillStyle='#000b';g.fillRect(0,0,W,H);g.fillStyle=mode==='win'?'#62e6a1':'#ff7770';g.font='bold 42px Arial';g.textAlign='center';g.fillText(mode==='win'?'MISSION COMPLETE':'MISSION FAILED',W/2,245);g.font='18px Arial';g.fillStyle='#fff';g.fillText('Press ENTER to deploy again',W/2,285);g.textAlign='left'}}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
