<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steel Falcon</title>
<style>html,body{margin:0;background:#101820;color:#eef;font:14px Arial;overflow:hidden}canvas{display:block;margin:auto;background:#24342d;max-width:100vw;max-height:100vh}#help{position:fixed;left:12px;bottom:10px;background:#0009;padding:8px;border-radius:6px}</style>
</head><body><canvas id="game" width="960" height="540"></canvas><div id="help">WASD / arrows move · Shift sprint · C crouch · Mouse shoot · E rescue · Reach extraction</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let keys={},mouse={x:480,y:270,down:false},win=false,over=false;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e')rescue()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*960/r.width;mouse.y=(e.clientY-r.top)*540/r.height});c.onmousedown=()=>mouse.down=1;c.onmouseup=()=>mouse.down=0;
let p={x:90,y:450,hp:100,st:100,ammo:18,weapon:'Pistol',cool:0,crouch:false};let ally={x:240,y:450,hp:100,rescued:false};let enemies=[{x:500,y:150,hp:3},{x:680,y:350,hp:3},{x:790,y:170,hp:3},{x:430,y:350,hp:3}];let guns=[{x:350,y:430,n:'Rifle',a:30},{x:590,y:450,n:'Shotgun',a:8},{x:740,y:100,n:'Sniper',a:5}];let last=0;
function rescue(){if(!ally.rescued&&Math.hypot(p.x-ally.x,p.y-ally.y)<55){ally.rescued=true;document.title='Steel Falcon — Teammate rescued'}}
function shoot(){if(p.cool>0||p.ammo<=0||over)return;p.cool=.18;p.ammo--;let ang=Math.atan2(mouse.y-p.y,mouse.x-p.x),best=null,bd=999;for(let e of enemies){let dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy),da=Math.abs(Math.atan2(Math.sin(ang-Math.atan2(dy,dx)),Math.cos(ang-Math.atan2(dy,dx))));if(d<500&&da<.13&&d<bd){best=e;bd=d}}if(best){best.hp--;if(best.hp<=0)enemies=enemies.filter(z=>z!==best)}}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){if(over)return;p.cool-=dt;p.crouch=!!keys.c;let sp=keys.shift&&p.st>0&&!p.crouch?260:keys.shift?120:p.crouch?80:170;if(keys.shift&&p.st>0)p.st-=35*dt;else p.st=Math.min(100,p.st+22*dt);let dx=(keys.d||keys.arrowright)-(keys.a||keys.arrowleft),dy=(keys.s||keys.arrowdown)-(keys.w||keys.arrowup),l=Math.hypot(dx,dy)||1;p.x+=dx/l*sp*dt;p.y+=dy/l*sp*dt;p.x=Math.max(20,Math.min(940,p.x));p.y=Math.max(40,Math.min(510,p.y));if(mouse.down)shoot();for(let g of guns)if(Math.hypot(p.x-g.x,p.y-g.y)<28){p.weapon=g.n;p.ammo=g.a;g.x=-100}for(let e of enemies){let d=Math.hypot(p.x-e.x,p.y-e.y);if(d<270&&!p.crouch){let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*45*dt;e.y+=Math.sin(a)*45*dt;if(d<38)p.hp-=18*dt}}if(ally.rescued){ally.x+=(p.x-ally.x)*Math.min(1,dt*3);ally.y+=(p.y-ally.y)*Math.min(1,dt*3);ally.hp=Math.max(0,ally.hp-0)}if(p.hp<=0||ally.hp<=0)over=true;if(ally.rescued&&p.x>875){win=true;over=true}}
function bar(v,max,w){x.fillStyle='#222';x.fillRect(0,0,w,8);x.fillStyle='#63d28b';x.fillRect(0,0,w*v/max,8)}
function draw(){x.clearRect(0,0,960,540);x.fillStyle='#31483b';x.fillRect(0,0,960,540);x.fillStyle='#536b51';for(let i=0;i<18;i++)x.fillRect((i*83)%960,70+(i*47)%430,50,12);x.fillStyle='#d8c36b';x.fillRect(875,0,65,540);x.fillStyle='#111';x.fillText('EXTRACT',882,270);for(let g of guns)if(g.x>0){x.fillStyle='#f0c94b';x.fillRect(g.x-9,g.y-5,18,10);x.fillStyle='#fff';x.fillText(g.n,g.x-22,g.y-12)}if(!ally.rescued){x.fillStyle='#54d68b';x.fillRect(ally.x-12,ally.y-12,24,24);x.fillStyle='#fff';x.fillText('RESCUE',ally.x-25,ally.y-20)}else{x.fillStyle='#78e0a0';x.fillRect(ally.x-10,ally.y-10,20,20)}for(let e of enemies){x.fillStyle='#d95757';x.fillRect(e.x-13,e.y-13,26,26);x.fillStyle='#222';x.fillRect(e.x-14,e.y-21,28,4);x.fillStyle='#e66';x.fillRect(e.x-14,e.y-21,28*e.hp/3,4)}x.save();x.translate(p.x,p.y);x.rotate(Math.atan2(mouse.y-p.y,mouse.x-p.x));x.fillStyle=p.crouch?'#5797d1':'#4c9eea';x.fillRect(-13,-13,26,26);x.fillStyle='#a9b6c0';x.fillRect(7,-4,22,8);x.restore();x.fillStyle='#fff';x.fillText('STEEL FALCON',18,25);x.fillText('HP',18,43);bar(p.hp,100,120);x.fillText('SPRINT',150,43);bar(p.st,100,120);x.fillText(`${p.weapon} · AMMO ${p.ammo}`,300,43);x.fillText(`TEAM: ${ally.rescued?'RESCUED':'FIND THEM'}`,500,43);if(over){x.fillStyle='#000b';x.fillRect(0,0,960,540);x.fillStyle='#fff';x.font='32px Arial';x.textAlign='center';x.fillText(win?'MISSION COMPLETE':'MISSION FAILED',480,250);x.font='16px Arial';x.fillText('Refresh to play again',480,285);x.textAlign='left'}}requestAnimationFrame(loop)
</script></body></html>
